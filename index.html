<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>BUY NOW OR LIVE</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 160 100%22><text y=%22.8em%22 font-size=%2280%22>🛑🎥</text></svg>" />
<link rel="manifest" href="/manifest.json" />
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png" />
<meta name="theme-color" content="#ea2804" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="BUY NOW OR LIVE" />
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
<style>
@font-face {
  font-family: 'JejuStoneWall';
  src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2210-EF@1.0/EF_jejudoldam.woff2') format('woff2');
  font-weight: normal;
  font-display: swap;
}
</style>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --canvas: #f9f7f3;
  --bone: #f3f0e8;
  --card: #ffffff;
  --dark: #202020;
  --deep: #000000;
  --ink: #202020;
  --body: #3a3a3a;
  --charcoal: #575757;
  --mute: #646464;
  --ash: #8d8d8d;
  --hairline: rgba(32,32,32,0.12);
  --hairline-strong: #202020;
  --primary: #ea2804;
  --primary-deep: #c01f00;
  --on-dark: #fcfcfc;
  --on-dark-mute: rgba(252,252,252,0.72);

  --urgency-live: linear-gradient(135deg, #ff3d2e 0%, #ea2804 100%);
  --urgency-1: linear-gradient(135deg, #ff7a45 0%, #ff5722 100%);
  --urgency-2: linear-gradient(135deg, #ffa45c 0%, #ff8a3d 100%);
  --urgency-3: linear-gradient(135deg, #ffc98a 0%, #ffaf5e 100%);
  --urgency-4: linear-gradient(135deg, #ffe4bf 0%, #ffd29c 100%);
  --past-gradient: linear-gradient(135deg, #3b3470 0%, #1f1b42 100%);
}

body {
  font-family: 'Pretendard', -apple-system, sans-serif;
  background-color: var(--canvas);
  background-image: url('https://raw.githubusercontent.com/zomdaa/LIVE_SCHEDULER_3/main/assets/BG.png');
  background-size: 100% auto;
  background-position: top center;
  background-repeat: no-repeat;
  background-attachment: fixed;
  color: var(--ink);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

@media (min-width: 768px) {
  body {
    background-image: url('https://raw.githubusercontent.com/zomdaa/LIVE_SCHEDULER_3/main/assets/BG_PC.png');
  }
}

.hero-band {
  width: 100%;
  padding: 3.25rem 1.5rem 2.5rem;
  text-align: center;
  position: relative;
  overflow: hidden;
}
.search-card-wrap { position: relative; max-width: 720px; margin: 1rem auto 0; }

.hero-deco {
  position: absolute;
  top: -90px;
  opacity: 1;
  pointer-events: none;
  z-index: 1;
}
.hero-deco img { width: 100%; display: block; filter: drop-shadow(0 6px 10px rgba(0,0,0,0.2)); }
.hero-deco.left { left: 4%; width: 110px; top: -90px; }
.hero-deco.right { right: 6%; width: 56px; top: -70px; }

@media (max-width: 640px) {
  .hero-deco.left { display: none; }
  .hero-deco.right { display: none; }
}
.hero-content { position: relative; z-index: 1; }
.eyebrow {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 13px;
  font-weight: 700;
  color: #1a1814;
  background: rgba(255,255,255,0.92);
  padding: 7px 16px;
  border-radius: 9999px;
  margin-bottom: 1.25rem;
  border: 1.5px solid #1a1814;
  box-shadow: 2px 2px 0 #1a1814;
}
.eyebrow .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--primary); }

.brand-title {
  margin-bottom: -0.3rem;
  display: flex;
  justify-content: center;
}
.brand-title img {
  max-width: 100%;
  width: 648px;
  height: auto;
  display: block;
  filter: drop-shadow(0 4px 10px rgba(0,0,0,0.25));
}

h1 {
  font-family: 'JejuStoneWall', 'Pretendard', sans-serif;
  font-size: 30px;
  font-weight: 400;
  letter-spacing: -0.01em;
  line-height: 1.15;
  color: #fff;
  margin-top: -0.4rem;
  margin-bottom: 0.85rem;
  text-shadow:
    -1.5px -1.5px 0 #1a4a6e, 1.5px -1.5px 0 #1a4a6e,
    -1.5px 1.5px 0 #1a4a6e, 1.5px 1.5px 0 #1a4a6e,
    0 3px 8px rgba(0,0,0,0.25);
}
.hero-highlight { color: #FFF380; }

.sub {
  font-size: 15px;
  font-weight: 700;
  color: #fff;
  line-height: 1.6;
  max-width: 480px;
  margin: 0 auto;
  text-shadow: 0 1px 4px rgba(0,0,0,0.4), 0 1px 0 rgba(0,0,0,0.3);
}

main {
  width: 100%;
  max-width: 720px;
  margin: 0 auto;
  padding: 0 1.5rem 4rem;
  position: relative;
}

body { padding-bottom: 100px; }

.bottom-nav {
  position: fixed;
  left: 50%;
  transform: translateX(-50%);
  bottom: calc(env(safe-area-inset-bottom, 0px) + 16px);
  z-index: 50;
  display: flex;
  width: max-content;
  background: rgba(255,255,255,0.42);
  backdrop-filter: blur(48px) saturate(200%) brightness(1.06);
  -webkit-backdrop-filter: blur(48px) saturate(200%) brightness(1.06);
  border: none;
  border-radius: 9999px;
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,0.9),
    0 4px 24px rgba(0,0,0,0.12),
    0 1px 6px rgba(0,0,0,0.07);
  overflow: hidden;
}
.bottom-nav::before {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: inherit;
  background: linear-gradient(180deg, rgba(255,255,255,0.38) 0%, rgba(255,255,255,0) 55%);
  pointer-events: none;
  z-index: 0;
}
.bottom-nav-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2px;
  padding: 10px 22px 8px;
  background: none;
  border: none;
  cursor: pointer;
  color: var(--ash);
  font-family: inherit;
  position: relative;
  z-index: 1;
}
.bottom-nav-icon { width: 20px; height: 20px; fill: currentColor; opacity: 0.5; }
.bottom-nav-label { font-size: 11px; font-weight: 600; }
.bottom-nav-item.active { color: var(--primary); }
.bottom-nav-item.active .bottom-nav-icon { opacity: 1; }

.tab-page-header {
  max-width: 720px;
  margin: 0 auto;
  padding: 2rem 1.5rem 0.5rem;
}
.tab-page-title {
  font-family: 'JejuStoneWall', 'Pretendard', sans-serif;
  font-size: 22px;
  color: var(--ink);
  margin-bottom: 4px;
}
.tab-page-sub {
  font-size: 13px;
  color: var(--mute);
  font-weight: 600;
}
.tab-page-sub-strong {
  font-size: 15px;
  color: var(--ink);
  font-weight: 800;
}

.calendar-date-tabs {
  display: flex;
  gap: 6px;
  overflow-x: auto;
  padding: 4px 2px 10px;
  margin-bottom: 4px;
  -webkit-overflow-scrolling: touch;
}
.calendar-date-tabs::-webkit-scrollbar { display: none; }
.calendar-date-tab {
  flex: 0 0 auto;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  width: 44px;
  padding: 8px 0 7px;
  border: 1.5px solid var(--hairline);
  border-radius: 12px;
  background: var(--card);
  color: var(--ink);
  cursor: pointer;
  font-family: inherit;
}
.calendar-date-tab.active {
  border-color: var(--primary);
  background: var(--primary);
  color: #fff;
}
.cdt-dow { font-size: 11px; font-weight: 700; opacity: 0.75; }
.cdt-day { font-size: 15px; font-weight: 800; }
.cdt-dot { width: 4px; height: 4px; border-radius: 50%; background: currentColor; }

.calendar-day-header {
  font-size: 18px;
  font-weight: 800;
  color: var(--ink);
  margin: 22px 0 12px;
  padding: 2px 4px 2px 10px;
  border-left: 4px solid var(--primary);
}
.calendar-day-header:first-child { margin-top: 4px; }

.hot-rank {
  background: var(--card);
  border-radius: 18px;
  padding: 16px 18px;
  margin-top: 1.25rem;
  margin-bottom: 1.25rem;
  position: relative;
  z-index: 1;
  border: 1.5px solid #1a1814;
  box-shadow: 2px 2px 0 #1a1814;
}
.hot-rank-title {
  font-size: 13px;
  font-weight: 800;
  color: var(--primary-deep);
  margin-bottom: 10px;
}
.hot-rank-list { display: flex; flex-direction: column; gap: 8px; }
.hot-rank-item {
  display: flex;
  align-items: center;
  gap: 10px;
  text-decoration: none;
  color: inherit;
  padding: 4px 2px;
  border-radius: 8px;
  transition: background 0.12s;
}
.hot-rank-item:hover { background: var(--bone); }
.hot-rank-num {
  flex-shrink: 0;
  width: 20px;
  text-align: center;
  font-size: 14px;
  font-weight: 800;
  color: var(--primary);
}
.hot-rank-item:nth-child(n+4) .hot-rank-num { color: var(--mute); }
.hot-rank-title-text {
  flex: 1;
  min-width: 0;
  font-size: 13px;
  font-weight: 600;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.hot-rank-heart {
  flex-shrink: 0;
  display: flex;
  align-items: center;
  gap: 3px;
  font-size: 11px;
  font-weight: 700;
  color: #ff3b5c;
}

.search-card {
  background: var(--card);
  border-radius: 20px;
  padding: 20px;
  width: 100%;
  position: relative;
  z-index: 2;
  border: 1.5px solid #1a1814;
  box-shadow: 3px 3px 0 #1a1814;
  box-sizing: border-box;
}

.search-wrap { display: flex; gap: 10px; }
.search-wrap input {
  flex: 1;
  height: 54px;
  padding: 0 20px;
  font-size: 16px;
  font-family: inherit;
  background: var(--bone);
  border: none;
  border-radius: 9999px;
  color: var(--ink);
  outline: none;
}
.search-wrap input::placeholder { color: var(--ash); }
.search-wrap input:focus { box-shadow: 0 0 0 3px rgba(59,130,246,0.35); }
.search-wrap button {
  height: 54px;
  padding: 0 22px;
  background: var(--primary);
  color: #fff;
  border: none;
  border-radius: 9999px;
  font-size: 15px;
  font-weight: 700;
  font-family: inherit;
  cursor: pointer;
  white-space: nowrap;
  transition: background 0.15s, transform 0.1s;
}
.search-wrap button:hover { background: var(--primary-deep); }
.search-wrap button:active { transform: scale(0.94) rotate(-1deg); }
.search-wrap button:disabled { opacity: 0.4; cursor: not-allowed; }

.chips { display: flex; gap: 10px; margin-top: 8px; flex-wrap: wrap; }
.chip {
  font-size: 13px;
  font-weight: 600;
  color: var(--charcoal);
  background: var(--bone);
  padding: 8px 16px;
  border-radius: 9999px;
  cursor: pointer;
  border: none;
  font-family: inherit;
  transition: background 0.15s;
}
.chip:hover { background: var(--hairline); }

/* ── 인기/최근 검색어 섹션 ── */
.kw-section { margin-top: 14px; }
.kw-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
.kw-label { font-size: 11px; font-weight: 700; color: var(--mute); letter-spacing: 0.04em; }
.kw-toggle {
  font-size: 11px; font-weight: 700; color: var(--primary);
  background: none; border: none; cursor: pointer; font-family: inherit;
  display: flex; align-items: center; gap: 3px; padding: 0;
}

/* 티커 (한 줄 슬라이드) */
.pop-ticker {
  display: flex; align-items: center; gap: 10px;
  padding: 4px 0;
  transition: opacity 0.18s ease, transform 0.18s ease;
}
.tick-rank {
  font-size: 12px; font-weight: 800; color: var(--primary);
  min-width: 28px; flex-shrink: 0;
}
.tick-word {
  font-size: 14px; font-weight: 700; color: var(--ink);
  background: none; border: none; cursor: pointer;
  font-family: inherit; padding: 0; text-align: left;
}
.tick-word:hover { color: var(--primary); }

/* 펼친 목록 */
.pop-list { display: flex; flex-direction: column; gap: 0; margin-top: 4px; }
.pop-list-item {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 0;
  border-bottom: 1px solid var(--hairline);
  cursor: pointer; background: none; border-left: none; border-right: none; border-top: none;
  font-family: inherit; width: 100%; text-align: left;
}
.pop-list-item:last-child { border-bottom: none; }
.pop-list-item:hover .pop-item-kw { color: var(--primary); }
.pop-item-rank { font-size: 12px; font-weight: 800; color: var(--primary); min-width: 28px; }
.pop-item-kw { font-size: 13px; font-weight: 600; color: var(--ink); }

@media (max-width: 640px) {
  .brand-title img { width: 252px; }
  h1 { font-size: 22px; }
  .sub { white-space: normal; }
  .search-wrap { flex-direction: column; }
  .search-wrap input {
    width: 100% !important;
    height: 58px !important;
    min-height: 58px !important;
    font-size: 16px !important;
    box-sizing: border-box !important;
    padding: 0 22px !important;
    line-height: normal !important;
  }
  .search-wrap button { width: 100%; height: 58px; margin-top: 8px; font-size: 15px; }
}

.verdict {
  background: linear-gradient(150deg, #fff5f3 0%, #fffcfb 55%, #fff 100%);
  border-radius: 24px;
  padding: 24px 26px 22px;
  margin-bottom: 1.5rem;
  margin-top: 28px;
  display: none;
  position: relative;
  z-index: 1;
  border: 1.5px solid rgba(234,40,4,0.18);
  box-shadow:
    0 0 0 4px rgba(234,40,4,0.05),
    0 8px 32px rgba(234,40,4,0.12),
    0 2px 8px rgba(0,0,0,0.05);
}
@keyframes verdictIn {
  from { opacity: 0; transform: scale(0.95) translateY(10px); }
  to   { opacity: 1; transform: scale(1)    translateY(0);    }
}
.verdict.show {
  display: block;
  animation: verdictIn 0.35s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
}
.verdict-tail {
  position: absolute;
  top: -14px;
  left: 28px;
  width: 40px;
  height: 18px;
  background: var(--primary);
  border-radius: 9999px 9999px 0 0;
  box-shadow: 0 -2px 8px rgba(234,40,4,0.2);
}
.verdict-label {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  background: rgba(234,40,4,0.1);
  color: var(--primary);
  font-size: 11px;
  font-weight: 800;
  letter-spacing: 0.05em;
  padding: 4px 10px;
  border-radius: 9999px;
  margin-bottom: 12px;
}
.verdict-title {
  font-size: 24px;
  font-weight: 800;
  color: var(--primary-deep);
  margin-bottom: 6px;
  line-height: 1.3;
}
.verdict-text {
  font-size: 16px;
  font-weight: 500;
  color: #4a3520;
  line-height: 1.6;
}
.verdict-text .highlight { color: var(--primary-deep); font-weight: 800; }

.verdict-savings {
  font-size: 15px;
  font-weight: 800;
  color: #1a8a4a;
  margin-top: 2px;
  margin-bottom: 6px;
}
.verdict-benefit {
  font-size: 13px;
  font-weight: 700;
  color: var(--primary-deep);
  margin-bottom: 6px;
}
.verdict-product {
  font-size: 12px;
  font-weight: 600;
  color: var(--mute);
  margin-top: 14px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.verdict-price-row {
  display: flex;
  align-items: baseline;
  gap: 8px;
  margin-top: 6px;
  padding-top: 12px;
  border-top: 1px dashed var(--hairline);
}
.verdict-price-now {
  font-size: 15px;
  font-weight: 700;
  color: var(--mute);
  text-decoration: line-through;
}
.verdict-price-arrow { font-size: 15px; font-weight: 800; color: var(--mute); }
.verdict-price-est {
  font-size: 19px;
  font-weight: 800;
  color: #d92c2c;
}
.verdict-broadcast-meta {
  margin-top: 8px;
  font-size: 12px;
  font-weight: 600;
  color: #4a3520;
}

.lowest-price-section {
  display: none;
  margin-top: 1.25rem;
  position: relative;
  z-index: 1;
}
.lowest-price-section.show { display: block; }
.lowest-price-section .section-header { margin-bottom: 10px; }
.lowest-price-list {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding-bottom: 2px;
  -webkit-overflow-scrolling: touch;
}
.lowest-price-card {
  flex: 0 0 auto;
  width: 108px;
  display: flex;
  flex-direction: column;
  gap: 6px;
  background: var(--card);
  border: 1.5px solid #1a1814;
  box-shadow: 2px 2px 0 #1a1814;
  border-radius: 12px;
  padding: 8px;
  text-decoration: none;
  color: inherit;
}
.lowest-price-image {
  width: 100%;
  height: 68px;
  border-radius: 8px;
  object-fit: cover;
  background: var(--bone);
}
.lowest-price-name {
  font-size: 11px;
  font-weight: 600;
  line-height: 1.3;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.lowest-price-value {
  font-size: 12px;
  font-weight: 800;
  color: var(--primary-deep);
  white-space: nowrap;
}
.lowest-price-cta {
  font-size: 10px;
  font-weight: 700;
  color: var(--mute);
  white-space: nowrap;
}

@media (min-width: 768px) {
  .lowest-price-list {
    overflow-x: visible;
  }
  .lowest-price-card {
    width: calc((100% - 4 * 8px) / 5);
  }
  .lowest-price-image { height: 96px; }
  .lowest-price-name { font-size: 12px; }
  .lowest-price-value { font-size: 13px; }
  .lowest-price-cta { font-size: 11px; }
}

.status {
  font-size: 13px;
  color: var(--mute);
  margin-bottom: 1rem;
  min-height: 18px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  position: relative;
  z-index: 1;
}
.spinner {
  width: 14px; height: 14px;
  border: 1.5px solid var(--hairline);
  border-top-color: var(--primary);
  border-radius: 50%;
  animation: spin 0.7s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes btn-bounce {
  0% { transform: scale(1); }
  30% { transform: scale(0.88) rotate(-2deg); }
  55% { transform: scale(1.06) rotate(1deg); }
  75% { transform: scale(0.97); }
  100% { transform: scale(1); }
}
.search-wrap button.bounce { animation: btn-bounce 0.45s ease; }

.loading-block {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 14px;
  padding: 2.5rem 1.5rem 2rem;
  position: relative;
  z-index: 1;
}
.loading-char-wrap {
  position: relative;
  width: 140px;
  height: 140px;
}
.loading-char {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: contain;
  filter: drop-shadow(0 4px 10px rgba(0,0,0,0.15));
  animation: loading-pop 0.5s steps(1) infinite;
}
@keyframes loading-pop {
  0%, 49% { transform: scale(1); }
  50% { transform: scale(1.06); }
  51%, 100% { transform: scale(1); }
}
.loading-text {
  font-size: 14px;
  font-weight: 700;
  color: var(--charcoal);
  text-align: center;
}

.section { margin-bottom: 2rem; }
.section-header {
  display: flex;
  align-items: center;
  gap: 9px;
  margin-bottom: 14px;
  padding: 0 4px;
}
.section-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
.dot-upcoming { background: var(--primary); }
.dot-past { background: #c9b020; }
.dot-price { background: #03c75a; }
.section-title {
  font-size: 16px;
  font-weight: 800;
  color: var(--ink);
}
.section-count {
  font-size: 13px;
  font-weight: 600;
  color: var(--mute);
  margin-left: auto;
}

.cards { display: flex; flex-direction: column; gap: 12px; }

.card {
  border-radius: 14px;
  padding: 16px 18px;
  display: flex;
  align-items: center;
  gap: 14px;
  text-decoration: none;
  color: inherit;
  position: relative;
  z-index: 1;
  min-height: 76px;
  border: 1.5px solid #1a1814;
  box-shadow: 2px 2px 0 #1a1814;

function switchView(view) {
  ['home', 'calendar', 'mypage'].forEach(v => {
    document.getElementById('view-' + v).style.display = v === view ? '' : 'none';

function calendarDateKey(d) {
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}

let calendarSelectedDate = null;

async function loadCalendar() {
  const el = document.getElementById('calendarResult');
  el.innerHTML = '<div class="empty">불러오는 중...</div>';
  try {
    const results = await Promise.all(CRAWL_PLATFORMS.map(p =>
      fetch(`/api/crawl?platform=${p}`)
        .then(r => r.ok ? r.json() : { upcoming: [] })
        .catch(() => ({ upcoming: [] }))
    ));
    const now = new Date();
    const cutoff = new Date(now.getTime() + 7 * 24 * 60 * 60 * 1000);

    let items = results.flatMap((r, i) =>
      (r.upcoming || []).map(item => ({ ...item, platformKey: CRAWL_PLATFORMS[i] }))
    );
    items = items
      .map(item => ({ item, start: parseLabangDate(item.start) }))
      .filter(x => x.start && x.start >= now && x.start <= cutoff)
      .sort((a, b) => a.start - b.start)
      .map(x => x.item);

    window.__upcomingItems = items;

    const byDate = {};
    items.forEach((item, idx) => {
      const d = parseLabangDate(item.start);
      const key = calendarDateKey(d);
      (byDate[key] = byDate[key] || []).push({ item, idx });
    });
    window.__calendarByDate = byDate;

    const days = [];
    for (let i = 0; i <= 7; i++) {
      days.push(new Date(now.getFullYear(), now.getMonth(), now.getDate() + i));
    }
    window.__calendarDays = days;

    if (!calendarSelectedDate || !days.some(d => calendarDateKey(d) === calendarSelectedDate)) {
      // 오늘 방송이 없으면 방송이 있는 가장 가까운 날짜를 기본 선택
      const firstWithItems = days.find(d => (byDate[calendarDateKey(d)] || []).length > 0);
      calendarSelectedDate = calendarDateKey(firstWithItems || days[0]);
    }

    renderCalendarView();
    loadLikeCounts();
    loadBenefits();
  } catch (e) {
    el.innerHTML = '<div class="empty">불러오지 못했어요</div>';
  }
}

function selectCalendarDate(key) {
  calendarSelectedDate = key;
  renderCalendarView();
  loadLikeCounts();
  loadBenefits();
}

function renderCalendarView() {
  const el = document.getElementById('calendarResult');
  const days = window.__calendarDays || [];
  const byDate = window.__calendarByDate || {};
  if (!days.length) {
    el.innerHTML = '<div class="empty">앞으로 7일간 예정된 방송이 없어요</div>';
    return;
  }

  const now = new Date();
  const todayKey = calendarDateKey(now);
  const dowLabels = ['일', '월', '화', '수', '목', '금', '토'];

  const tabsHtml = days.map(d => {
    const key = calendarDateKey(d);
    const count = (byDate[key] || []).length;
    const active = key === calendarSelectedDate;
    return `
      <button class="calendar-date-tab ${active ? 'active' : ''}" onclick="selectCalendarDate('${key}')">
        <span class="cdt-dow">${key === todayKey ? '오늘' : dowLabels[d.getDay()]}</span>
        <span class="cdt-day">${d.getDate()}</span>
        <span class="cdt-dot" style="visibility:${count ? 'visible' : 'hidden'}"></span>
      </button>`;
  }).join('');

  const selectedDay = days.find(d => calendarDateKey(d) === calendarSelectedDate);
  const headerLabel = selectedDay
    ? `${calendarDateKey(selectedDay) === todayKey ? '오늘 · ' : ''}${selectedDay.getMonth() + 1}월 ${selectedDay.getDate()}일 (${dowLabels[selectedDay.getDay()]})`
    : '';
  const entries = byDate[calendarSelectedDate] || [];
  const listHtml = entries.length
    ? `<div class="cards">${entries.map(e => upcomingCard(e.item, e.idx)).join('')}</div>`
    : `<div class="empty">이 날은 예정된 방송이 없어요</div>`;

  el.innerHTML = `
    <div class="calendar-date-tabs">${tabsHtml}</div>
    <div class="calendar-day-header">${headerLabel}</div>
    ${listHtml}`;
}

async function loadMyPage() {
  const reminders = getReminders()
    .filter(r => r.startAt && r.startAt > Date.now())
    .sort((a, b) => a.startAt - b.startAt);
  const reminderListEl = document.getElementById('myReminderList');
  const reminderCountEl = document.getElementById('myReminderCount');
  reminderCountEl.textContent = reminders.length ? `${reminders.length}건` : '';
  if (reminders.length) {
    reminderListEl.innerHTML = `<div class="cards">${reminders.map(r => {
      const dt = fmtDate(new Date(r.startAt));
      return `
      <a class="card urgency-3" href="${escapeAttr(r.url || '#')}" target="_blank" rel="noopener">
        <div class="info">
          <div class="info-top">
            <span class="platform">${escapeAttr(r.platform || '')}</span>
            <span class="date-tag">🔔 ${dt.month}/${dt.day} ${dt.time}</span>
          </div>
          <div class="title">${escapeAttr(r.title || '')}</div>
        </div>
      </a>`;
    }).join('')}</div>`;
  } else {
    reminderListEl.innerHTML = '<div class="empty">알림 설정한 방송이 없어요</div>';
  }

  const likedIds = [...getLikedSet()];
  const likeListEl = document.getElementById('myLikeList');
  const likeCountEl = document.getElementById('myLikeCount');
  if (!likedIds.length) {
    likeCountEl.textContent = '';
    likeListEl.innerHTML = '<div class="empty">찜한 방송이 없어요</div>';
    return;
  }
  likeListEl.innerHTML = '<div class="empty">불러오는 중...</div>';
  try {
    const r = await fetch('/api/like?ids=' + encodeURIComponent(likedIds.join(',')) + '&meta=true');
    const data = await r.json();
    const now = new Date();
    const items = likedIds.map(id => data.meta?.[id]).filter(Boolean).filter(item => {
      // 종료된 방송은 찜 목록에서 자동으로 빠진다. end가 없는 옛날 기록은
      // start+2시간을 종료 시점으로 추정한다 (알림 정리 로직과 동일한 기준)
      const start = parseLabangDate(item.start);
      const end = parseLabangDate(item.end) || (start ? new Date(start.getTime() + 2 * 60 * 60 * 1000) : null);
      return !end || end >= now;
    });
    likeCountEl.textContent = items.length ? `${items.length}건` : '';
    if (!items.length) {
      likeListEl.innerHTML = '<div class="empty">찜한 방송이 없어요</div>';
      return;
    }
    likeListEl.innerHTML = `<div class="cards">${items.map(item => {
      const start = parseLabangDate(item.start || item.end);
      const dt = fmtDate(start);
      const days = daysFromNow(start);
      const isLive = start ? start <= now : false;
      const urgency = start ? urgencyClass(isLive, false, days) : 'urgency-4';
      const dDayLabel = !start ? '찜' : isLive ? '● LIVE' : days === 0 ? '오늘' : days === 1 ? '내일' : `D-${days}`;
      const likeId = item.id || '';
      return `
      <a class="card ${urgency}" href="${escapeAttr(item.url || '#')}" target="_blank" rel="noopener">
        <div class="info">
          <div class="info-top">
            <span class="platform">${escapeAttr(item.platform || '')}</span>
            <span class="date-tag">${dDayLabel} · ${dt.month}/${dt.day} ${dt.time}</span>
          </div>
          <div class="title">${escapeAttr(item.title || '')}</div>
        </div>
        ${likeId ? `
        <button class="like-btn liked" data-like-id="${likeId}" data-title="${escapeAttr(item.title)}" data-url="${escapeAttr(item.url)}" data-platform="${escapeAttr(item.platform)}" data-start="${escapeAttr(item.start)}" data-end="${escapeAttr(item.end)}" onclick="unlikeFromMyPage(event, '${likeId}')">
          <svg class="heart-icon" width="18" height="18" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 20.5C12 20.5 3 15 3 8.8C3 5.7 5.4 3.5 8.2 3.5C9.8 3.5 11.2 4.3 12 5.6C12.8 4.3 14.2 3.5 15.8 3.5C18.6 3.5 21 5.7 21 8.8C21 15 12 20.5 12 20.5Z" stroke="currentColor" stroke-width="1.8"/>
          </svg>
          <span class="like-count">0</span>
        </button>` : ''}
      </a>`;
    }).join('')}</div>`;
    loadLikeCounts();
  } catch (e) {
    likeListEl.innerHTML = '<div class="empty">불러오지 못했어요</div>';
  }
}

// MY 페이지 찜 목록에서 하트를 다시 누르면 그 자리에서 바로 찜 해제

// ── 인기검색어 티커 ──
let _popularItems = [];
let _tickerIdx = 0;
let _tickerTimer = null;
let _popularExpanded = false;

function searchFromTicker() {
  const kw = _popularItems[_tickerIdx]?.keyword;
  if (kw) quickSearch(kw);
}

function _updateTicker(animate) {
  const ticker = document.getElementById('popTicker');
  const rankEl = document.getElementById('tickerRank');
  const wordEl = document.getElementById('tickerWord');
  if (!ticker || !rankEl || !wordEl || !_popularItems.length) return;
  if (animate) {
    ticker.style.opacity = '0';
    ticker.style.transform = 'translateY(5px)';
    setTimeout(() => {
      rankEl.textContent = _tickerIdx + 1 + '위';
      wordEl.textContent = _popularItems[_tickerIdx].keyword;
      ticker.style.opacity = '1';
      ticker.style.transform = 'translateY(0)';
    }, 180);
  } else {
    rankEl.textContent = _tickerIdx + 1 + '위';
    wordEl.textContent = _popularItems[_tickerIdx].keyword;
  }
}

function _startTicker() {
  _updateTicker(false);
  _tickerTimer = setInterval(() => {
    _tickerIdx = (_tickerIdx + 1) % _popularItems.length;
    _updateTicker(true);
  }, 2500);
}

function _stopTicker() {
  if (_tickerTimer) { clearInterval(_tickerTimer); _tickerTimer = null; }
}

function togglePopular() {
  const btn = document.getElementById('kwToggle');
  const ticker = document.getElementById('popTicker');
  const list = document.getElementById('popList');
  _popularExpanded = !_popularExpanded;
  if (_popularExpanded) {
    _stopTicker();
    ticker.style.display = 'none';
    list.style.display = 'flex';
    btn.textContent = '접기 ▴';
  } else {
    list.style.display = 'none';
    ticker.style.display = 'flex';
    btn.textContent = '펼치기 ▾';
    _startTicker();
  }
}

function _showPopular(items) {
  _popularItems = items;
  _tickerIdx = 0;
  _popularExpanded = false;
  document.getElementById('popularSection').style.display = '';
  // 펼친 목록 렌더링
  const listEl = document.getElementById('popList');
  listEl.innerHTML = items.map((item, i) =>
    `<button class="pop-list-item" onclick="quickSearch('${escapeAttr(item.keyword)}')">
      <span class="pop-item-rank">${i + 1}위</span>
      <span class="pop-item-kw">${escapeAttr(item.keyword)}</span>
    </button>`
  ).join('');
  _startTicker();
}

async function loadChips() {
  const recent = getRecentKeywords();
  if (recent.length > 0) {
    document.getElementById('recentSection').style.display = '';
    renderChips(recent);
    return;
  }
  try {
    const r = await fetch('/api/popular');

loadChips();

function getLikedSet() {
  try {
    return new Set(JSON.parse(localStorage.getItem('likedBroadcasts') || '[]'));
  } catch {
    return new Set();
  }
}

function saveLikedSet(set) {
  try {
    localStorage.setItem('likedBroadcasts', JSON.stringify([...set]));
  } catch {}
}

async function toggleLike(evt, id) {
  evt.preventDefault();
  evt.stopPropagation();

  const btn = evt.currentTarget;
  const countEl = btn.querySelector('.like-count');
  const liked = getLikedSet();
  const isLiked = liked.has(id);
  const action = isLiked ? 'unlike' : 'like';
  const title = btn.dataset.title || '';
  const url = btn.dataset.url || '';
  const platform = btn.dataset.platform || '';
  const start = btn.dataset.start || '';
  const end = btn.dataset.end || '';

  btn.disabled = true;
  try {
    const r = await fetch('/api/like', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ id, action, title, url, platform, start, end }),
    });
    const data = await r.json();
    if (typeof data.count === 'number') {
      countEl.textContent = data.count;
    }
    if (isLiked) {
      liked.delete(id);
      btn.classList.remove('liked');
    } else {
      liked.add(id);
      btn.classList.add('liked');
    }
    saveLikedSet(liked);
  } catch (e) {
    // 실패 시 조용히 무시
  } finally {
    btn.disabled = false;
  }
}

async function loadLikeCounts() {
  const buttons = document.querySelectorAll('.like-btn[data-like-id]');
  if (!buttons.length) return;
  const ids = [...buttons].map(b => b.dataset.likeId);
  const liked = getLikedSet();

  buttons.forEach(b => {
    if (liked.has(b.dataset.likeId)) b.classList.add('liked');
  });

  try {
    const r = await fetch('/api/like?ids=' + encodeURIComponent(ids.join(',')));
    const data = await r.json();
    const counts = data.counts || {};
    buttons.forEach(b => {
      const c = counts[b.dataset.likeId];
      if (typeof c === 'number') {
        b.querySelector('.like-count').textContent = c;
      }
    });
  } catch (e) {}
}

// 크롬 익스텐션이 방송 상세 페이지에서 OCR로 읽어둔 혜택 정보를 카드에 표시한다.
// GET은 캐시 조회뿐이라 (OCR을 직접 트리거하지 않음) 카드 수만큼 불러도 저렴하다
async function loadBenefits() {
  const els = document.querySelectorAll('.benefit[data-benefit-url], .main-product[data-benefit-url]');
  if (!els.length) return;
  const urls = [...new Set([...els].map(el => el.dataset.benefitUrl))];
  await fetchAndApplyBenefits(urls, els);
}

// 카카오/네이버처럼 서버가 처음 보는 방송이면, 응답을 늦추지 않으려고 서버가
// 백그라운드에서 채워두고 이번 응답엔 안 담아 보낸다 (api/benefit.js 참고).
// 그래서 한 번 응답을 받은 뒤, 그때 못 받은 것들만 잠깐 기다렸다 한 번 더
// 물어봐서 처음 여는 날짜에도 뱃지가 뜨게 한다 (재시도는 딱 한 번만)
async function fetchAndApplyBenefits(urls, els, isRetry) {
  try {
    const r = await fetch('/api/benefit?ids=' + encodeURIComponent(urls.join(',')));
    const data = await r.json();
    const benefits = data.benefits || {};
    const missed = [];
    const seenMiss = new Set();
    els.forEach(el => {
      const url = el.dataset.benefitUrl;
      const b = benefits[url];
      if (!b) {
        if (!seenMiss.has(url)) { missed.push(url); seenMiss.add(url); }
        return;
      }
      if (el.classList.contains('main-product')) {
        // 이 방송의 대표(1번) 상품 이름+가격을 혜택 뱃지 아래 작게 보여준다.
        // 가격만 기존 혜택 텍스트와 같은 버건디색으로 강조한다
        const top = (b.products || [])[0];
        if (!top || !top.name) return;
        const priceHtml = typeof top.price === 'number'
          ? ` · <span class="main-product-price">${top.price.toLocaleString('ko-KR')}원</span>`
          : '';
        el.innerHTML = escapeHtml(top.name) + priceHtml;
        el.style.display = '';
        return;
      }
      const parsed = b.parsed;
      if (!parsed) return;
      const parts = [];
      if (parsed.discount) parts.push(`💰 ${parsed.discount} 할인`);
      if (parsed.coupon) parts.push(parsed.coupon);
      if (parsed.gift) parts.push(parsed.gift);
      if (!parts.length) return;
      el.textContent = parts.join(' · ');
      el.style.display = '';
    });
    // 딱 한 번만 재시도한다 - /replays/ 같은 서버가 아예 처리할 수 없는 id는
    // resolveApiSource가 영영 못 찾아서 항상 "missed"로 남는데, 재시도 결과에서도
    // 또 setTimeout을 걸면(예전 코드가 그랬음) 그 방송은 4초마다 영원히 다시
    // 조회된다 - 실제로 이 버그 때문에 같은 배치 요청이 수십 번 쌓여
    // 레이트리밋(429)을 계속 유발하는 걸 발견했다
    if (missed.length && !isRetry) {
      setTimeout(() => {
        const stillHere = [...document.querySelectorAll('.benefit[data-benefit-url], .main-product[data-benefit-url]')]
          .filter(el => missed.includes(el.dataset.benefitUrl));
        if (stillHere.length) fetchAndApplyBenefits(missed, stillHere, true);
      }, 4000);
    }
  } catch (e) {}
}

function handleCardClick(event, idx) {

function fmtWon(n) {
  if (n === null || n === undefined || isNaN(n)) return null;
  return Number(n).toLocaleString('ko-KR') + '원';
}

function renderProduct(p) {
  const hasDiscount = p.discountRate && p.discountRate > 0 && p.price;
  let priceHtml = '';
  if (p.price) {
    if (hasDiscount) {
      const original = Math.round(p.price / (1 - p.discountRate / 100));
      priceHtml = `<span class="modal-product-discount">${p.discountRate}%</span>${fmtWon(p.price)} <span class="modal-product-original">${fmtWon(original)}</span>`;
    } else {
      priceHtml = fmtWon(p.price);
    }
  }
  return `
    <a class="modal-product" href="${escapeAttr(p.url || '#')}" target="_blank" rel="noopener">
      ${p.image ? `<img src="${escapeAttr(p.image)}" alt="" loading="lazy" />` : ''}
      <div class="modal-product-info">
        <div class="modal-product-name">${escapeAttr(p.name || '')}</div>
        ${priceHtml ? `<div class="modal-product-price">${priceHtml}</div>` : ''}
      </div>
    </a>`;
}

function renderModalBase(item) {
  const start = parseLabangDate(item.start);
  const dt = start ? fmtDate(start) : null;
  const metaText = dt ? `${dt.month}/${dt.day} ${dt.time}` : '';
  const reminderId = item.id ? String(item.id) : '';
  const canRemind = !!(reminderId && start && start > new Date());
  const isReminded = canRemind && getReminders().some(r => r.id === reminderId);

  return `
    <span class="modal-platform">${escapeAttr(item.platform || '')}</span>
    <div class="modal-title">${escapeAttr(item.title || '')}</div>
    <div class="modal-meta">${escapeAttr(item.channel || '')}${item.channel && metaText ? ' · ' : ''}${metaText}</div>
    <div class="modal-actions">
      <a class="modal-btn modal-btn-watch" href="${escapeAttr(item.url || '#')}" target="_blank" rel="noopener">📺 방송 보러가기</a>
      ${canRemind ? `<button class="modal-btn modal-btn-notify${isReminded ? ' on' : ''}" id="modalNotifyBtn" onclick="toggleReminder(event, '${reminderId}')">${isReminded ? '🔔 알림 설정됨' : '🔕 알림받기'}</button>` : ''}
    </div>
    <div id="modalDynamic"><div class="modal-loading"><div class="spinner"></div>혜택 정보를 불러오는 중..</div></div>`;
}

async function openDetailModal(item) {
  const overlay = document.getElementById('detailModalOverlay');
  const body = document.getElementById('detailModalBody');
  body.innerHTML = renderModalBase(item);
  overlay.classList.add('show');
  document.body.style.overflow = 'hidden';

  const platformKey = item.platformKey;
  // 무신사는 카드의 id가 자체 숫자 idx라 상세 API가 쓰는 캠페인 해시와 다름 - url에서 뽑아 쓴다
  let id = item.id;
  if (platformKey === 'musinsa' && item.url) {
    const m = item.url.match(/campaign\/([a-zA-Z0-9]+)/);
    if (m) id = m[1];
  }
  const dynamic = document.getElementById('modalDynamic');
  if (!platformKey || !id) {
    if (dynamic) dynamic.innerHTML = '';
    return;
  }

  try {
    const r = await fetch(`/api/crawl?platform=${encodeURIComponent(platformKey)}&action=detail&id=${encodeURIComponent(id)}`);
    const data = await r.json();
    // 팝업이 이미 닫혔거나 다른 방송으로 바뀌었으면 무시
    if (!document.getElementById('detailModalOverlay').classList.contains('show')) return;
    const dynamicNow = document.getElementById('modalDynamic');
    if (!dynamicNow) return;

    if (!r.ok) {
      dynamicNow.innerHTML = `<div class="modal-empty">${escapeAttr(data.error || '혜택 정보를 불러오지 못했어요. 잠시 후 다시 시도해주세요.')}</div>`;
      return;
    }

    const detail = data.detail;
    if (!detail) {
      dynamicNow.innerHTML = `<div class="modal-empty">이 플랫폼은 상세 혜택 정보를 불러올 수 없어요. 방송 페이지에서 직접 확인해주세요!</div>`;
      return;
    }

    let html = '';
    if (detail.image) {
      html += `<div class="modal-image"><img src="${escapeAttr(detail.image)}" alt="" loading="lazy" /></div>`;
    }
    if (detail.benefits && detail.benefits.length) {
      html += `<div class="modal-section-title">🎁 혜택</div><ul class="modal-benefits">${detail.benefits.map(b => `<li>${escapeAttr(b).replace(/\n/g, '<br>')}</li>`).join('')}</ul>`;
    }
    if (detail.benefitImages && detail.benefitImages.length) {
      html += `<div class="modal-section-title">🎁 혜택</div><div class="modal-benefit-images">${detail.benefitImages.map(src => `<img src="${escapeAttr(src)}" alt="" loading="lazy" />`).join('')}</div>`;
    }
    if (detail.products && detail.products.length) {
      html += `<div class="modal-section-title">🛍️ 판매 상품 (${detail.products.length})</div><div class="modal-products">${detail.products.map(renderProduct).join('')}</div>`;
    }
    if (!html) {
      html = `<div class="modal-empty">공개된 상세 혜택 정보가 없어요.</div>`;
    }
    dynamicNow.innerHTML = html;
  } catch (e) {
    const dynamicNow = document.getElementById('modalDynamic');
    if (dynamicNow) dynamicNow.innerHTML = `<div class="modal-empty">혜택 정보를 불러오지 못했어요.</div>`;
  }
}

}

// 알림받기 - 웹푸시 구독에 성공하면 앱이 꺼져 있어도 서버가 정해진 시각에
// 알려준다(api/push.js). 구독/전송에 실패하는 환경(iOS 사파리 미설치 등)을
// 대비해 이 탭이 열려있는 동안은 로컬 타이머로도 한 번 더 확인해 폴백한다.
const REMINDER_KEY = 'bnol_reminders';

function getReminders() {
  try { return JSON.parse(localStorage.getItem(REMINDER_KEY) || '[]'); } catch (e) { return []; }
}
function saveReminders(list) {
  try { localStorage.setItem(REMINDER_KEY, JSON.stringify(list)); } catch (e) {}
}

function urlBase64ToUint8Array(base64String) {
  const padding = '='.repeat((4 - base64String.length % 4) % 4);
  const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
  const rawData = atob(base64);
  return Uint8Array.from([...rawData].map(c => c.charCodeAt(0)));
}

// 탭/앱이 꺼져 있어도 알림이 오도록 브라우저 푸시 구독을 만든다. 실패해도(구형
// 브라우저, iOS 사파리 미설치 등) 조용히 null을 반환해서 로컬 타이머로 폴백한다
async function ensurePushSubscription() {
  if (!('serviceWorker' in navigator) || !('PushManager' in window)) return null;
  try {
    const reg = await navigator.serviceWorker.ready;
    let sub = await reg.pushManager.getSubscription();
    if (!sub) {
      const r = await fetch('/api/push?action=public-key');
      const { publicKey } = await r.json();
      if (!publicKey) return null;
      sub = await reg.pushManager.subscribe({
        userVisibleOnly: true,
        applicationServerKey: urlBase64ToUint8Array(publicKey),
      });
    }
    return sub;
  } catch (e) {
    return null;
  }
}

// iOS는 사파리로 홈 화면에 설치된 상태(standalone)에서만 Notification/Push API가
// 존재한다 - 크롬iOS도 내부적으로 사파리 엔진이라 똑같이 막혀 있다
function isIOSDevice() {
  const ua = navigator.userAgent || '';
  if (/iPad|iPhone|iPod/.test(ua)) return true;
  // iPadOS는 데스크탑 UA를 보내는 경우가 많아 멀티터치 Mac으로 우회 감지
  return navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1;
}

function isStandalonePWA() {
  return window.navigator.standalone === true || window.matchMedia('(display-mode: standalone)').matches;
}

function isChromeIOS() {
  return /CriOS/.test(navigator.userAgent || '');
}

// iOS는 다른 앱이 x-safari-https: 스킴을 열면 그 주소를 사파리로 넘겨준다 -
// 크롬iOS 안에서도 이걸 이용하면 "사파리에서 열기" 버튼을 만들 수 있다
function openInSafari() {
  window.location.href = 'x-safari-https://' + location.host + location.pathname + location.search;
}

function showIOSInstallGuide() {

    </div>
    ${inChrome ? `<button class="modal-btn modal-btn-watch" onclick="openInSafari()" style="margin-bottom:16px;">🧭 사파리에서 열기</button>` : ''}
    <ol style="padding-left:20px; display:flex; flex-direction:column; gap:10px; font-size:14px; line-height:1.5; margin-bottom:20px;">
      ${inChrome ? '' : '<li><b>사파리</b> 열기!</li>'}
      <li>공유 버튼(⬆️) 탭!</li>

async function toggleReminder(evt, id) {
  const btn = evt.currentTarget;
  const item = (window.__upcomingItems || []).find(i => String(i.id) === id);
  if (!item) return;

  let list = getReminders();
  const exists = list.some(r => r.id === id);

  if (exists) {
    const removed = list.find(r => r.id === id);
    list = list.filter(r => r.id !== id);
    saveReminders(list);
    btn.textContent = '🔕 알림받기';
    btn.classList.remove('on');
    if (removed?.pushScheduled) {
      ensurePushSubscription().then(sub => {
        if (!sub) return;
        fetch('/api/push', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action: 'cancel', subscription: sub.toJSON(), broadcastId: id }),
        }).catch(() => {});
      });
    }
    return;
  }

  if (isIOSDevice() && !isStandalonePWA()) {
    showIOSInstallGuide();
    return;
  }
  if (!('Notification' in window)) {
    alert('이 브라우저는 알림 기능을 지원하지 않아요.');
    return;
  }
  let permission = Notification.permission;
  if (permission === 'default') {
    permission = await Notification.requestPermission();
  }
  if (permission !== 'granted') {
    alert('알림 권한이 거부되어 있어요. 브라우저 설정에서 이 사이트의 알림을 허용해주세요.');
    return;
  }

  const start = parseLabangDate(item.start);
  const startAt = start ? start.getTime() : null;

  let pushScheduled = false;
  if (startAt) {
    const sub = await ensurePushSubscription();
    if (sub) {
      try {
        const r = await fetch('/api/push', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            action: 'schedule',
            subscription: sub.toJSON(),
            broadcast: { id, title: item.title, url: item.url, platform: item.platform, startAt },
          }),
        });
        pushScheduled = r.ok;
      } catch (e) {}
    }
  }

  list.push({
    id,
    title: item.title,
    platform: item.platform,
    url: item.url,
    startAt,
    notified: false,
    pushScheduled,
  });
  saveReminders(list);
  btn.textContent = '🔔 알림 설정됨';
  btn.classList.add('on');
}

function checkReminders() {
  const list = getReminders();
  if (!list.length) return;
  const now = Date.now();
  let changed = false;
  const remaining = [];

  list.forEach(r => {
    if (!r.startAt) { remaining.push(r); return; }

    // 시작 후 2시간 지난 항목은 정리
    if (now > r.startAt + 2 * 60 * 60 * 1000) {
      changed = true;
      return;
    }

    if (now >= r.startAt && !r.notified) {
      // 서버 웹푸시로 예약된 항목은 탭이 닫혀 있어도 알림이 오니, 여기서 또
      // 띄우면 탭이 열려 있을 때 중복 알림이 뜬다 - 푸시 예약 실패한 것만 폴백으로 쏜다
      if (!r.pushScheduled && 'Notification' in window && Notification.permission === 'granted') {
        try {
          const dt = fmtDate(new Date(r.startAt));
          const n = new Notification('🔔 알림 걸어둔 방송이 곧 시작합니다!', {
            body: `${dt.month}/${dt.day} ${dt.time} · ${r.title || ''}`,
            tag: 'bnol-' + r.id,
          });
          n.onclick = () => { window.open(r.url, '_blank'); n.close(); };
        } catch (e) {}
      }
      changed = true;
      remaining.push({ ...r, notified: true });
    } else {
      remaining.push(r);
    }
  });

  if (changed) saveReminders(remaining);
}
setInterval(checkReminders, 30000);
checkReminders();

function parseLabangDate(str) {
  if (!str || str.length < 8) return null;
  // 6개 플랫폼 직접 크롤러는 ISO 형식("2026-07-09T20:00:00")을 쓰고,
  // 라방바 쪽은 숫자만 있는 자체 형식("2607092000")을 쓴다 - 둘 다 처리
  if (str.includes('-')) {
    const d = new Date(str);
    return isNaN(d.getTime()) ? null : d;
  }
  const yy = str.slice(0, 2), mm = str.slice(2, 4), dd = str.slice(4, 6);
  const hh = str.slice(6, 8), mi = str.slice(8, 10) || '00';
  return new Date(`20${yy}-${mm}-${dd}T${hh}:${mi}:00`);
}

// 카카오/11번가/무신사/오늘의집은 종료 시각(end)을 아예 안 준다(항상 null) -
// 그래서 오늘 19시에 시작한 방송이 지금 21시여도 "아직 안 끝남"으로 잘못
// 분류돼 계속 예정 방송에 남아있는 버그가 있었다. end가 없으면 먼저 플랫폼이
// 주는 상태값(카카오 FINISHED/11번가 VOD=다시보기)으로 판단하고, 그것도
// 애매하면(무신사 BEFORE는 "오늘"이라는 뜻일 뿐 종료 여부가 아님) 시작 후
// 60분이 지났으면 끝난 걸로 간주한다
const ASSUMED_LIVE_DURATION_MS = 60 * 60 * 1000;
function isBroadcastEnded(item, now) {
  const end = parseLabangDate(item.end);
  if (end) return end < now;
  if (/FINISHED|VOD|ENDED/i.test(item.status || '')) return true;
  const start = parseLabangDate(item.start);
  if (!start) return false;
  return (now - start) > ASSUMED_LIVE_DURATION_MS;
}

function parseSearchDate(str) {
  const m = str.match(/(\d{2})\.(\d{2})\.(\d{2})\s*\([^)]+\)\s*(\d{2}:\d{2})/);
  if (!m) return null;
  return new Date(`20${m[1]}-${m[2]}-${m[3]}T${m[4]}:00`);
}

function fmtDate(d) {
  if (!d) return { month: '?', day: '?', time: '' };
  return {
    month: d.getMonth() + 1,
    day: d.getDate(),
    time: `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`,
  };
}

function daysFromNow(d) {
  if (!d) return null;
  // 시:분까지 포함해서 반올림하면 "오늘 밤 11시"와 "내일 새벽 1시"처럼 실제로는
  // 하루 차이인데 몇 시간 안 남았다는 이유로 같은 날로 계산되는 문제가 있어서,
  // 달력상의 날짜(자정 기준)만 비교한다
  const now = new Date();
  const startOfToday = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const startOfTarget = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  return Math.round((startOfTarget - startOfToday) / (1000 * 60 * 60 * 24));
}

function escapeAttr(str) {
  return String(str || '').replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

function escapeHtml(str) {
  return String(str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function formatVerdictBody(text) {
  if (!text) return '';
  // 문장 종결 부호(. ! ?) 뒤에서 분리하되 구분자는 유지
  const sentences = text.match(/[^.!?]+[.!?]+(\s|$)/g) || [text];
  const trimmed = sentences.map(s => s.trim()).filter(Boolean);
  // 너무 짧은 마지막 문장은 바로 앞 문장과 합쳐 한 줄 외톨이 방지
  if (trimmed.length > 1 && trimmed[trimmed.length - 1].length <= 6) {
    const last = trimmed.pop();
    trimmed[trimmed.length - 1] += ' ' + last;
  }
  return trimmed.map(escapeAttr).join('<br>');
}

// 오늘의집은 모든 방송이 같은 기획전 URL을 공유해서 item.url로 조회하면
// 서로 덮어써버린다 - 대신 채널(브랜드)명으로 만든 키를 쓴다. extension의
// benefit-content.js가 오늘의집에서 정확히 이 키 형식("ohouse-brand:{브랜드명}")으로
// POST하므로 서로 반드시 일치해야 한다
function benefitKeyFor(item) {
  if (item.platformKey === 'ohouse' && item.channel) return 'ohouse-brand:' + item.channel;
  return item.url || null;
}

function urgencyClass(isLive, isEnded, days) {
  if (isEnded) return 'urgency-ended';
  if (isLive) return 'urgency-live';
  if (days <= 1) return 'urgency-1';
  if (days <= 3) return 'urgency-2';
  if (days <= 7) return 'urgency-3';
  return 'urgency-4';
}

function upcomingCard(item, idx) {
  const start = parseLabangDate(item.start);
  const dt = fmtDate(start);
  const now = new Date();
  const isEnded = isBroadcastEnded(item, now);
  const isLive = item.status === 1 && !isEnded;
  const days = daysFromNow(start);
  const urgency = urgencyClass(isLive, isEnded, days);
  const likeId = item.id || '';

  let dDayLabel;
  if (isEnded) {
    dDayLabel = '종료';
  } else if (isLive) {
    dDayLabel = '● LIVE';
  } else if (days === 0) {
    // 오늘 방송은 "오늘"보다 "3시간 후"처럼 임박도를 바로 알 수 있는 게
    // 유용해서 시작까지 남은 시간을 직접 카운트다운으로 보여준다
    const diffMs = start ? start - now : null;
    if (diffMs === null || diffMs <= 0) {
      dDayLabel = '오늘';
    } else if (diffMs < 60 * 60 * 1000) {
      dDayLabel = `${Math.max(1, Math.round(diffMs / 60000))}분 후`;
    } else {
      dDayLabel = `${Math.floor(diffMs / (60 * 60 * 1000))}시간 후`;
    }
  } else {
    dDayLabel = `D-${days}`;
  }

  const likeHtml = likeId ? `
      <button class="like-btn" data-like-id="${likeId}" data-title="${escapeAttr(item.title)}" data-url="${escapeAttr(item.url)}" data-platform="${escapeAttr(item.platform)}" data-start="${escapeAttr(item.start)}" data-end="${escapeAttr(item.end)}" onclick="toggleLike(event, '${likeId}')">
        <svg class="heart-icon" width="18" height="18" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 20.5C12 20.5 3 15 3 8.8C3 5.7 5.4 3.5 8.2 3.5C9.8 3.5 11.2 4.3 12 5.6C12.8 4.3 14.2 3.5 15.8 3.5C18.6 3.5 21 5.7 21 8.8C21 15 12 20.5 12 20.5Z" stroke="currentColor" stroke-width="1.8"/>
        </svg>
        <span class="like-count">0</span>
      </button>` : '';

  return `
    <a class="card ${urgency}" href="${item.url || '#'}" target="_blank" rel="noopener" onclick="return handleCardClick(event, ${idx})">
      <div class="info">
        <div class="info-top">
          <span class="platform">${item.platform || '라이브'}</span>
          <span class="date-tag">${dDayLabel} · ${dt.month}/${dt.day} ${dt.time}</span>
        </div>
        <div class="title">${item.title}</div>
        ${benefitKeyFor(item) ? `<div class="main-product" data-benefit-url="${escapeAttr(benefitKeyFor(item))}" style="display:none"></div>` : ''}
      </div>
      ${likeHtml}
    </a>`;
}

function pastCard(item) {
  const d = parseLabangDate(item.start);
  const dt = fmtDate(d);
  const days = daysFromNow(d);
  const ago = days === null ? Math.abs(0) : Math.abs(days);
  const likeId = item.id || '';
  const likeHtml = likeId ? `
      <div class="like-btn liked-readonly" data-like-id="${likeId}">
        <svg class="heart-icon" width="18" height="18" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 20.5C12 20.5 3 15 3 8.8C3 5.7 5.4 3.5 8.2 3.5C9.8 3.5 11.2 4.3 12 5.6C12.8 4.3 14.2 3.5 15.8 3.5C18.6 3.5 21 5.7 21 8.8C21 15 12 20.5 12 20.5Z" stroke="currentColor" stroke-width="1.8"/>
        </svg>
        <span class="like-count">0</span>
      </div>` : '';
  return `
    <a class="card past" href="${item.url}" target="_blank" rel="noopener">
      <div class="info">
        <div class="info-top">
          <span class="platform">${item.platform}</span>
          <span class="date-tag">${ago}일 전 · ${dt.month}/${dt.day} ${dt.time}</span>
        </div>
        <div class="title">${item.title}</div>
        ${benefitKeyFor(item) ? `<div class="main-product" data-benefit-url="${escapeAttr(benefitKeyFor(item))}" style="display:none"></div>` : ''}
      </div>
      ${likeHtml}
    </a>`;
}

function makeVerdict(upcoming, past) {
  const nextBcast = upcoming.find(u => {
    const end = parseLabangDate(u.end);
    return !end || end >= new Date();
  }) || upcoming[0];
  const lastBcast = past[0];

  const freqCount = past.length;
  const freqPhrase = freqCount > 0 ? `최근 약 2개월간 ${freqCount}회 방송이 있었어요.` : null;

  if (!nextBcast) {
    if (past.length > 0) {
      const last = parseLabangDate(lastBcast.start);
      const ago = Math.abs(daysFromNow(last));
      const body = freqCount >= 3
        ? `${freqPhrase} 방송 빈도가 높은 편이라, 급한 구매가 아니라면 조금 기다려 보는 것은 어때요!?`
        : `현시점 최저가로 구매해보세요! 최근 방송은 ${ago}일 전이었어요 (${lastBcast.platform}).`;
      return {
        title: '예정된 방송이 없습니다ㅠ',
        body
      };
    }
    return {
      title: '예정된 방송이 없습니다ㅠ',
      body: '현시점 최저가로 구매해보세요!'
    };
  }

  const start = parseLabangDate(nextBcast.start);
  const days = daysFromNow(start);
  const hh = String(start.getHours()).padStart(2, '0');
  const mm = String(start.getMinutes()).padStart(2, '0');
  const timeStr = `${hh}:${mm}`;

  if (days === 0) {
    return {
      title: '이따 라방 있어요!',
      body: `오늘 ${timeStr} ${nextBcast.platform}에서 방송 예정입니다. 조금 기다린 후 혜택을 확인하고 구매하는 것을 권장해요!`
    };
  } else if (days === 1) {
    return {
      title: '곧 라방이 있어요!',
      body: `내일 ${timeStr} ${nextBcast.platform}에서 방송 예정입니다. 조금 기다린 후 혜택을 확인하고 구매하는 것을 권장해요!`
    };
  } else if (days <= 3) {
    return {
      title: '곧 라방이 있어요!',
      body: `${days}일 후 ${timeStr} ${nextBcast.platform}에서 방송 예정입니다. 조금 기다린 후 혜택을 확인하고 구매하는 것을 권장해요!`
    };
  } else if (days <= 7) {
    return {
      title: '곧 라방이 있어요!',
      body: `${days}일 후 방송이 예정되어 있어요 (${nextBcast.platform}). ${freqCount >= 2 ? freqPhrase + ' ' : ''}급하지 않다면 기다려볼 만해요.`
    };
  } else {
    return {
      title: '라방 편성이 되어있어요!',
      body: `가장 가까운 방송까지 ${days}일 남았어요. ${freqCount >= 2 ? freqPhrase + ' ' : ''}급하면 지금 구매, 여유 있으면 기다려보세요.`
    };
  }
}

// 반환값(items)을 doSearch가 받아 판결 카드(loadJudgement)의 "현재가" 기준으로도
// 재사용한다 - 같은 키워드로 네이버 API를 두 번 부르지 않기 위함
async function loadLowestPrice(keyword) {
  const section = document.getElementById('lowestPriceSection');
  const listEl = document.getElementById('lowestPriceList');
  try {
    const r = await fetch(`/api/naver-price?keyword=${encodeURIComponent(keyword)}`);
    if (!r.ok) return null;
    const data = await r.json();
    const isDesktop = window.matchMedia('(min-width: 768px)').matches;
    const items = (data.items || []).slice(0, isDesktop ? 5 : 3);
    if (!items.length) return null;

    const affiliateId = data.coupangAffiliateId || '';
    listEl.innerHTML = items.map(item => {
      const coupangUrl = 'https://www.coupang.com/np/search?q=' + encodeURIComponent(item.productName || keyword) +
        (affiliateId ? '&affiliate=' + encodeURIComponent(affiliateId) : '');
      return `
      <a class="lowest-price-card" href="${escapeAttr(coupangUrl)}" target="_blank" rel="noopener">
        <img class="lowest-price-image" src="${escapeAttr(item.image || '')}" alt="" loading="lazy" />
        <div class="lowest-price-name">${escapeAttr(item.productName || '')}</div>
        <div class="lowest-price-value">${item.lowestPrice ? Number(item.lowestPrice).toLocaleString('ko-KR') + '원' : ''}</div>
        <div class="lowest-price-cta">쿠팡에서 찾아보기 →</div>
      </a>`;
    }).join('');
    section.classList.add('show');
    return items;
  } catch (e) {
    // 실패 시 조용히 숨김 유지
    return null;
  }
}

// 판결 카드는 두 갈래 데이터가 합쳐져야 완성된다: ① 네이버쇼핑 "현재가"
// (naverProducts[0], loadLowestPrice가 이미 받아온 값을 재사용) ② 라이브 방송
// "방송 예상가" - 다음 방송 자체에 이미 뜬 1번(대표) 상품가, 없으면 최근 방송들의
// 1번 상품 평균가로 대체. 판결 카드 자체(제목/본문)는 render()가 makeVerdict로
// 이미 그려놨고, 이 함수는 그 위에 가격 비교 파트만 도착하는 대로 "덧붙인다".
// 둘 중 하나라도 없으면 기존 타이밍 문구를 그대로 두고 조용히 끝낸다
async function loadJudgement(upcoming, past, myEpoch, naverPricePromise) {
  const naverItems = await naverPricePromise;
  if (myEpoch !== searchEpoch) return; // 그 사이 다른 키워드로 새 검색이 시작됨

  const naverItem = naverItems && naverItems[0];
  if (!naverItem || !(naverItem.lowestPrice > 0)) {
    verdictEl.classList.add('show'); // 가격 데이터 없음 → 타이밍 문구만으로 카드 표시
    return;
  }
  const currentPrice = naverItem.lowestPrice;

  const items = [...upcoming, ...past];
  const urls = [...new Set(items.map(benefitKeyFor).filter(Boolean))];
  if (!urls.length) {
    verdictEl.classList.add('show'); // 방송 URL 없음 → 타이밍 문구만으로 카드 표시
    return;
  }

  let benefits = {};
  try {
    const r = await fetch('/api/benefit?ids=' + encodeURIComponent(urls.join(',')));
    const data = await r.json();
    benefits = data.benefits || {};
  } catch (e) {
    verdictEl.classList.add('show'); // 혜택 API 실패 → 타이밍 문구만으로 카드 표시
    return;
  }
  if (myEpoch !== searchEpoch) return; // 새 검색이 시작됐으면 표시하지 않음

  // 방송의 1번(대표) 상품만 기준으로 삼는다 - 카드에 보여주는 대표 상품과 통일
  const mainProduct = (item) => {
    const top = (benefits[benefitKeyFor(item)]?.products || [])[0];
    return (top && typeof top.price === 'number' && top.price > 0) ? top : null;
  };

  const fmt = (n) => Math.round(n).toLocaleString('ko-KR') + '원';
  const rawName = naverItem.productName || '';
  const productName = rawName.length > 20 ? rawName.slice(0, 20) + '…' : rawName;

  const nextBcast = upcoming.find(u => {
    const end = parseLabangDate(u.end);
    return !end || end >= new Date();
  }) || upcoming[0];

  if (!nextBcast) {
    // 예정 방송이 없으면 "방송 예상가"라는 비교 대상 자체가 없다
    verdictTitle.textContent = '지금 최저가로 구매하세요!';
    verdictText.innerHTML = '';
    if (productName) {
      const productEl = document.getElementById('verdictProduct');
      productEl.textContent = `🛍️ ${productName} 기준 · 현재 최저가 ${fmt(currentPrice)}`;
      productEl.style.display = '';
    }
    verdictEl.classList.add('show');
    return;
  }

  const npNext = mainProduct(nextBcast);
  const pastMains = past.map(mainProduct).filter(Boolean);
  const pastAvg = pastMains.length
    ? Math.round(pastMains.reduce((a, b) => a + b.price, 0) / pastMains.length)
    : null;
  const broadcastPrice = npNext ? npNext.price : pastAvg;
  if (broadcastPrice === null) {
    verdictEl.classList.add('show'); // 예상가 데이터 없음 → 타이밍 문구만으로 카드 표시
    return;
  }

  const days = Math.max(0, daysFromNow(parseLabangDate(nextBcast.start)));
  const savings = currentPrice - broadcastPrice;

  if (broadcastPrice < currentPrice) {
    verdictTitle.textContent = days === 0 ? '오늘 방송 후 사세요!'
      : days === 1 ? '내일 라이브 방송이 있어요!'
      : `${days}일 후 라이브 방송이 있어요!`;
  } else {
    verdictTitle.textContent = '지금 사도 괜찮아요!';
  }
  verdictText.innerHTML = '';

  // 방송 일시/플랫폼 — 판결 문구 바로 아래
  const dt = fmtDate(parseLabangDate(nextBcast.start));
  const metaEl = document.getElementById('verdictBroadcastMeta');
  metaEl.textContent = `📺 ${dt.month}/${dt.day} ${nextBcast.platform} · D-${days}`;
  metaEl.style.display = '';

  // 다음 방송 혜택(할인/쿠폰/사은품)
  const nextBenefitKey = benefitKeyFor(nextBcast);
  const nextParsed = nextBenefitKey && benefits[nextBenefitKey]?.parsed;
  if (nextParsed) {
    const parts = [];
    if (nextParsed.discount) parts.push(`${nextParsed.discount} 할인`);
    if (nextParsed.coupon) parts.push(nextParsed.coupon);
    if (nextParsed.gift) parts.push(nextParsed.gift);
    if (parts.length) {
      const benefitEl = document.getElementById('verdictBenefit');
      benefitEl.textContent = `🎁 ${parts.join(' · ')}`;
      benefitEl.style.display = '';
    }
  }

  if (savings > 0) {
    const savingsEl = document.getElementById('verdictSavings');
    savingsEl.textContent = `💰 약 ${fmt(savings)} 저렴해요`;
    savingsEl.style.display = '';

    const productEl = document.getElementById('verdictProduct');
    productEl.textContent = `🛍️ ${productName} 기준`;
    productEl.style.display = '';

    document.getElementById('verdictPriceNow').textContent = fmt(currentPrice);
    document.getElementById('verdictPriceEst').textContent = fmt(broadcastPrice);
    document.getElementById('verdictPriceRow').style.display = 'flex';
  }

  // 모든 데이터가 채워진 뒤 카드를 한 번에 등장 — 깜빡임 없이 완성된 상태로 보인다
  verdictEl.classList.add('show');
}

// 예정 방송을 먼저 보여준 뒤 지난 방송을 나중에 이어붙이는 구조라, 그 사이에
// 사용자가 다른 키워드로 다시 검색하면 이전 검색의 느린 지난 방송 응답이 나중에
// 도착해 새 검색 결과를 덮어쓸 수 있다 - 검색마다 세대 번호를 매겨서, 자기보다
// 최신 검색이 이미 시작됐으면 조용히 렌더링을 건너뛴다
let searchEpoch = 0;

async function doSearch() {
  const keyword = input.value.trim();
  if (!keyword) return;

  const myEpoch = ++searchEpoch;
  saveRecentKeyword(keyword);

  btn.disabled = true;
  verdictEl.classList.remove('show');
  hideVerdictPriceParts();
  startLoadingAnimation();
  document.getElementById('lowestPriceSection').classList.remove('show');
  setStatus('');

  const naverPricePromise = loadLowestPrice(keyword);

  let upcoming = [];
  let past = [];
  let endedFromUpcoming = [];

  function render(searchPending) {
    const verdict = makeVerdict(upcoming, past);
    if (verdict) {
      verdictTitle.textContent = verdict.title;
      verdictText.innerHTML = formatVerdictBody(verdict.body);
      // show는 loadJudgement가 가격 데이터까지 채운 뒤 한 번만 — 여기서 add('show')하면
      // 타이밍 문구가 먼저 보였다가 가격 문구로 교체될 때 깜빡임이 생긴다
    } else {
      verdictEl.classList.remove('show');
    }

    let html = '';
    window.__upcomingItems = upcoming;

    if (upcoming.length) {
      html += `
        <div class="section">
          <div class="section-header">
            <div class="section-dot dot-upcoming"></div>
            <div class="section-title">예정 방송</div>
            <div class="section-count">${upcoming.length}건</div>
          </div>
          <div class="cards">${upcoming.map((item, idx) => upcomingCard(item, idx)).join('')}</div>
        </div>`;
    }

    if (past.length) {
      html += `
        <div class="section">
          <div class="section-header">
            <div class="section-dot dot-past"></div>
            <div class="section-title">지난 방송 · 최근 3개월</div>
            <div class="section-count">${past.length}건</div>
          </div>
          <div class="cards">${past.map(pastCard).join('')}</div>
          <div class="data-credit">지난 방송 데이터 출처: 라방바 데이터랩</div>
        </div>`;
    } else if (searchPending) {
      // 과거 방송 조회(/api/search)는 외부 API를 60일치 훑어야 해서 예정 방송보다
      // 훨씬 느리다 - 여기서 같이 기다리게 하지 않고, 예정 방송을 먼저 보여준 뒤
      // 지난 방송은 도착하는 대로 이어붙인다
      html += `<div class="section-loading">지난 방송 불러오는 중...</div>`;
    }

    if (!html) {
      html = `<div class="empty">😢 "${keyword}" 방송 기록이 없어요.<br>브랜드명을 다시 확인해보세요.</div>`;
    }

    resultEl.innerHTML = html;
    loadLikeCounts();
    loadBenefits();
    // 지난 방송이 다 갖춰진 뒤(!searchPending)에만 계산한다 - 예정 방송만 있는
    // 빠른 1차 렌더에서도 매번 호출하면, 그 요청이 늦게 끝날 경우 이미 완성된
    // 2차 렌더 결과를 오래된(불완전한) 데이터로 덮어써버리는 경쟁 상태가 생긴다
    if (!searchPending) loadJudgement(upcoming, past, myEpoch, naverPricePromise);
  }

  try {
    const crawlResults = await Promise.all(CRAWL_PLATFORMS.map(p =>
      fetch(`/api/crawl?platform=${p}&keyword=${encodeURIComponent(keyword)}`)
        .then(r => r.ok ? r.json() : { upcoming: [] })
        .catch(() => ({ upcoming: [] }))
    ));

    const rawUpcoming = crawlResults.flatMap((r, i) =>
      (r.upcoming || []).map(item => ({ ...item, platformKey: CRAWL_PLATFORMS[i] }))
    );

    const now = new Date();
    const upcomingCutoff = new Date(now.getTime() + 31 * 24 * 60 * 60 * 1000);
    const stillUpcoming = [];

    rawUpcoming.forEach(item => {
      const start = parseLabangDate(item.start);
      if (start && start > upcomingCutoff) return; // 검색일 기준 +31일 넘는 예정 방송은 제외
      if (isBroadcastEnded(item, now)) {
        endedFromUpcoming.push(item);
      } else {
        stillUpcoming.push(item);
      }
    });

    upcoming = stillUpcoming.sort((a, b) => {
      const da = parseLabangDate(a.start);
      const db = parseLabangDate(b.start);
      if (!da) return 1;
      if (!db) return -1;
      return da - db;
    });
    past = [...endedFromUpcoming].sort((a, b) => String(b.start).localeCompare(String(a.start)));

    if (myEpoch !== searchEpoch) return; // 그 사이 다른 키워드로 새 검색이 시작됨

    stopLoadingAnimation();
    render(true);
    btn.disabled = false;

    // 지난 방송(라방바 60일 스캔)은 여기서부터 기다린다 - 이미 예정 방송은 화면에
    // 떠 있으니 사용자를 막지 않는다
    const searchRes = await fetch(`/api/search?keyword=${encodeURIComponent(keyword)}`);
    const searchData = await searchRes.json();

    if (myEpoch !== searchEpoch) return; // 응답 도착 전에 더 최신 검색이 시작됨 - 결과 버림

    if (!searchRes.ok) {
      setStatus(searchData.error || '지난 방송을 불러오지 못했어요.');
      render(false);
      return;
    }

    const rawPast = searchData.past || [];
    past = [...endedFromUpcoming, ...rawPast]
      .sort((a, b) => String(b.start).localeCompare(String(a.start)));

    const total = upcoming.length + past.length;
    setStatus(total ? '' : '검색 결과가 없어요');
    render(false);

  } catch (e) {
    if (myEpoch === searchEpoch) setStatus('오류: ' + e.message);
  } finally {
    if (myEpoch === searchEpoch) {
      stopLoadingAnimation();
      btn.disabled = false;
    }
  }
}
</script>
</body>
</html>
