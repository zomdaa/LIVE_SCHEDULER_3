name: Scrape blocked platforms

on:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - '.github/workflows/scrape.yml'
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch: {}

jobs:
  scrape-oliveyoung:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scripts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Scrape oliveyoung and ingest
        env:
          INGEST_URL: https://buynoworlive.vercel.app/api/ingest
          INGEST_SECRET: ${{ secrets.INGEST_SECRET }}
        run: node scrape-oliveyoung.js

  diagnose-gmarket:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scripts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Check whether gmarket's Cloudflare challenge can be passed
        run: node diagnose-gmarket.js
